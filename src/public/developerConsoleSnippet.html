<!DOCTYPE html>
<html lang="it">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0">
		<title>Layout con Editor e Toolbar</title>
		<script src="codemirror.js"></script>
		<link rel="stylesheet"
			href="codemirror.css">
		<script src="clike.js"></script>
		<script src="overlay.js"></script>
		<script src="apexsnippet.js"></script>
		<link rel="stylesheet"
			href="developerConsoleSnippet.css">
		<script type="module"
			src="developerConsoleSnippet.js"></script>
	</head>

	<body>

		<div class="container">

			<div class="sidebar-left">
				<h4 class="listheader titleGrid">SNIPPET</h4>
				<ul id="snippetlistobj">
					<!-- <li>
						<div class="object-item">
							<div>Oggetto 1</div>
							<div class="object-buttons">
								<button class="run-btn">RUN</button>
								<button class="copy-btn">COPY</button>
								<button class="delete-btn">DELETE</button>
							</div>
						</div>
					</li> -->
				</ul>
			</div>

			<div class="editor">
				<h3>Editor di Testo</h3>
				<div class="editor-sub">
					<textarea id="editor"
						style="border-radius: 10px;width: 100%;height: 100%;border: none;resize: none;outline: none;padding: 0px;font-size: 1rem;"></textarea>
				</div>
				<div
					style="margin-right: 5%;margin-top: 2%;display: flex;flex-direction: row;flex-wrap: nowrap;justify-content: flex-end;align-items: center;">
					<button class="run-btn">NEW SNIPPET</button>
					<button class="copy-btn"
						style="margin-left: 2%;">SAVE/EDIT</button>
					<button class="delete-btn"
						style="margin-left: 5%;">DELETE</button>
				</div>
			</div>

			<div class="sidebar-right">
				<h4>Aiuto</h4>
				<ul id="snippetlistobj">
					<li><a href="#">Guida rapida</a></li>
					<li><a href="#">Shortcut</a></li>
					<li><a href="#">FAQ</a></li>
					<li><a href="#">Contatti</a></li>
				</ul>
			</div>

			<div class="toolbar">
				<button class="standard-btn"
					style="margin-left: auto;">SAVE</button>
				<button class="standard-btn">IMPORT</button>
				<button class="standard-btn">EXPORT</button>
				<button class="delete-btn"
					style="margin-left: auto">CLOSE</button>
			</div>

		</div>

	</body>

</html>
