<!DOCTYPE html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Layout con Editor e Toolbar</title>
		<script src="codemirror.js"></script>
		<link rel="stylesheet" href="codemirror.css" />
		<script src="clike.js"></script>
		<script src="searchcursor.js"></script>
		<script src="overlay.js"></script>
		<script src="apexsnippet.js"></script>
		<link rel="stylesheet" href="developerConsoleSnippet.css" />
		<script type="module" src="developerConsoleSnippet.js"></script>
	</head>

	<body>
		<div class="modal-overlay" id="modalOverlay"></div>

		<div class="container">
			<div class="sidebar-left">
				<h4 class="listheader titleGrid">SNIPPET</h4>
				<ul id="snippetlistobj"></ul>
			</div>

			<div class="top-editor">
				<div
					class="editorheader titleGrid"
					style="
						top: 1%;
						width: 53.9%;
						left: 25.4%;
						margin-top: 1.1%;
						display: flex;
						flex-direction: row;
						flex-wrap: nowrap;
						justify-content: center;
						align-items: center;
					"
				>
					<button
						id="snippetnewcode"
						class="run-btn"
						style="margin-left: 1%"
					>
						+ new
					</button>
					<h3 style="margin-left: 30%; margin-right: auto">
						CODE SNIPPET
					</h3>
				</div>

				<div class="editor">
					<button
						id="snippetaddvariable"
						class="copy-btn"
						style="margin-top: 6%; margin-left: 2%"
					>
						Add variable snippet
					</button>
					<div class="editor-sub">
						<textarea
							id="editor"
							style="
								border-radius: 10px;
								width: 100%;
								height: 100%;
								border: none;
								resize: none;
								outline: none;
								padding: 0px;
								font-size: 1rem;
							"
						></textarea>
						<div class="snippetnewname">
							<span id="ghostname" class="ghostname">NAME:</span>
							<input
								id="snippetnewname"
								class="snippet-name"
								type="text"
								placeholder="new snippet"
							/>
						</div>
						<div
							style="
								bottom: 16.5%;
								right: 22%;
								position: absolute;
								display: flex;
								flex-direction: row;
								flex-wrap: nowrap;
								justify-content: flex-end;
								align-items: center;
							"
						>
							<div class="info-code" id="infoCode">
								<div
									class="error-icon-code"
									id="pErrorIcon"
								></div>
								<p id="pError">0</p>
								<div
									class="warning-icon-code"
									id="pWarningIcon"
								></div>
								<p id="pWarning">0</p>
							</div>
							<button
								id="btnsavesnippetobject"
								class="copy-btn"
								style="margin-left: 2%"
							>
								SAVE
							</button>
							<button class="delete-btn" style="margin-left: 5%">
								DELETE
							</button>
						</div>
					</div>
				</div>
				<div class="editorclose">
					<span
						>Click on the green “+ new” button to create a new
						CodeSnippet!
						<br />
						Should you need help you will find everything
						here:</span
					>
				</div>
			</div>

			<div class="sidebar-right">
				<h4 class="listheader-right titleGrid">TOOLS</h4>
				<div class="tool">
					<span>STORED VARIABLES</span>
					<ul id="listactivablevar"></ul>
				</div>
			</div>

			<div class="toolbar">
				<button class="standard-btn" style="margin-left: auto">
					SAVE
				</button>
				<button class="standard-btn">IMPORT</button>
				<button class="standard-btn">EXPORT</button>
				<button class="delete-btn" style="margin-left: auto">
					CLOSE
				</button>
			</div>
		</div>
	</body>
</html>
