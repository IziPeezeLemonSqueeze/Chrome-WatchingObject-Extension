<!DOCTYPE html>
<html lang="it">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0">
		<title>Layout con Editor e Toolbar</title>
		<style>
			::-webkit-scrollbar {
				width: 10px;
				margin-left: 1%
			}

			::-webkit-scrollbar-track {
				border-radius: 8px;
				background-color: #e7e7e7;
				border: 1px solid #cacaca;
			}

			::-webkit-scrollbar-thumb {
				border-radius: 8px;
				background-color: #60bdff;
			}

			.iframe {
				margin: 0;
				padding: 0;
				height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.container {
				display: grid;
				grid-template-areas:
					"left content right"
					"toolbar toolbar toolbar";
				grid-template-columns: 195px 1fr 150px;
				grid-template-rows: 1fr auto;
				gap: 10px;
				width: 90%;
				height: 90vh;
				background-color: #fff;
				border-radius: 12px;
				box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
				padding: 10px;
			}

			.sidebar-left {
				grid-area: left;
				background-color: #e9ecef;
				border-radius: 8px;
				overflow-y: auto;
			}

			.sidebar-right {
				grid-area: right;
				background-color: #e9ecef;
				padding: 10px;
				border-radius: 8px;
				overflow-y: auto;
			}

			.editor {
				grid-area: content;
				background-color: #f8f9fa;
				padding: 15px;
				border-radius: 8px;
			}

			.editor-sub {
				width: 543px;
				height: 292px;
			}

			.toolbar {
				grid-area: toolbar;
				background-color: #dee2e6;
				padding: 5px;
				display: flex;
				justify-content: center;
				gap: 15px;
				border-radius: 8px;
			}

			button {
				position: relative;
				padding: 5px 8px;
				border: none;
				border-radius: 5px;
				background-color: #007BFF;
				color: #fff;
				font-size: 1rem;
				cursor: pointer;
				transition: box-shadow 0.2s ease, transform 0.2s ease;
			}

			button:active {
				transform: scale(0.98);
			}

			@keyframes clickGlow {
				0% {
					box-shadow: 0 0 0px rgba(0, 170, 255, 0);
				}

				50% {
					box-shadow: 0 0 20px rgba(0, 170, 255, 1);
				}

				100% {
					box-shadow: 0 0 0px rgba(0, 170, 255, 0);
				}
			}

			/* Classe che attiva l'animazione */
			button.click-animate {
				animation: clickGlow 0.5s ease;
			}

			ul {
				list-style: none;
				padding: 0;
				margin: 0;
			}

			ul li {
				margin-bottom: 10px;
			}

			a {
				text-decoration: none;
				color: #007bff;
			}

			a:hover {
				text-decoration: underline;
			}

			.object-item {
				background-color: #dee2e6;
				padding: 10px;
				margin-bottom: 10px;
				border-radius: 6px;
				display: flex;
				flex-direction: column;
				gap: 8px;
				cursor: pointer;
				transition: transform 0.1s, background-color 0.2s;
			}

			.object-item:active {
				transform: scale(0.98);
				background-color: #ced4da;
			}

			.run-btn {
				background-color: #28a745;
				font-size: 0.7rem;
			}

			.copy-btn {
				background-color: #17a2b8;
				font-size: 0.7rem;
			}

			.delete-btn {
				background-color: #dc3545;
				font-size: 0.7rem;
			}

			.listheader {
				align-content: center;
				text-align: center;
				height: 37px;
				width: 194px;
				border-radius: 10px 10px 0px 0px;
				margin-bottom: -5%;
				position: relative;
				top: -4%;
				background-color: #dee2e6;
			}
		</style>
	</head>

	<body>

		<div class="container">

			<div class="sidebar-left">
				<h4 class="listheader">SNIPPET</h4>
				<ul id="snippetlistobj">
					<li>
						<div class="object-item">
							<div>Oggetto 1</div>
							<div class="object-buttons">
								<button class="run-btn">RUN</button>
								<button class="copy-btn">COPY</button>
								<button class="delete-btn">DELETE</button>
							</div>
						</div>
					</li>
				</ul>
			</div>

			<div class="editor">
				<h3>Editor di Testo</h3>
				<div class="editor-sub">
					<textarea
						style="border-radius: 10px;width: 100%;height: 100%;border: none;resize: none;outline: none;padding: 0px;font-size: 1rem;"></textarea>
				</div>
				<div
					style="margin-right: 5%;margin-top: 2%;display: flex;flex-direction: row;flex-wrap: nowrap;justify-content: flex-end;align-items: center;">
					<button class="run-btn">RUN</button>
					<button class="copy-btn"
						style="margin-left: 2%;">SAVE EDIT</button>
					<button class="delete-btn"
						style="margin-left: 5%;">DELETE</button>
				</div>
			</div>

			<div class="sidebar-right">
				<h4>Aiuto</h4>
				<ul>
					<li><a href="#">Guida rapida</a></li>
					<li><a href="#">Shortcut</a></li>
					<li><a href="#">FAQ</a></li>
					<li><a href="#">Contatti</a></li>
				</ul>
			</div>

			<div class="toolbar">
				<button style="margin-left: auto;">Save</button>
				<button>Import</button>
				<button>Export</button>
				<button style="margin-left: auto;background-color: #dc3545;">Exit</button>
			</div>

		</div>

	</body>

</html>
