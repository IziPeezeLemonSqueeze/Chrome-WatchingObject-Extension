<!DOCTYPE html>
<html>

	<head>
		<link href="salesforce-lightning-design-system.min.css"
			rel="stylesheet"
			type="text/css" />
		<script type="module"
			src="dock.js"></script>
	</head>

	<body>
		<div class="slds-page-header"
			style="padding: 0.2rem;">
			<div class="slds-page-header__row">
				<div class="slds-page-header__col-title">
					<div class="slds-media">
						<div class="slds-media__figure">
							<span class="slds-icon_container slds-icon-standard-opportunity"
								style="background: #f3f3f3;">
								<img src="/images/icon.png"
									style="background: #f3f3f3; margin-left: 14px"
									width="35px"
									height="35px" />
							</span>
						</div>
						<div class="slds-media__body"
							style="align-self: center;">
							<div class="slds-page-header__name">
								<div class="slds-page-header__name-title">
									<h1>
										<span class="slds-page-header__title slds-truncate"
											style="font-style: italic;"
											title="Salesforce Enhancer">Salesforce Enhancer</span>
									</h1>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="tutorial">
			<div id="stepOneBlock">
				<p>Welcome!</p>
				<p>Let's start with Settings!</p>
				<p id="freccia"></p>
			</div>
			<div id="stepTwoUpBlock">
				<p>Select API</p>
				<p>Version</p>
			</div>
			<div id="stepTwoBlock">

			</div>
			<div id="stepGreetings">
				Thank You!
			</div>
		</div>
		<div id="main"
			class="slds-align_absolute-center"
			style="text-align: center; height: 25rem">
			<ul class="slds-has-block-links_space">
				<li style="margin: 1px">
					<button title="Show the api name of the object fields"
						class="slds-button slds-button_brand"
						style="text-wrap: nowrap; width: 150px"
						id="btnApiFields">
						Show API name FIELDS
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Show the CODE SNIPPET screen"
						class="slds-button slds-button_brand"
						style="text-wrap: nowrap; width: 150px"
						id="btnFastCodeSnippet">
						CODE SNIPPET
					</button>
				</li>
				<hr style="margin-top: 0.8rem; margin-bottom: 0.8rem;" />
				<div
					style="padding: 1px;background-clip: text;background-color: #eef4ff;-webkit-text-stroke-width: medium;z-index: 100;position: absolute;bottom: 67%;left: 39%;">
					Shortcuts</div>
				<li style="margin: 1px">
					<button title="Open a new tab in the Object Manager settings"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnObjectManager">
						Object Manager
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Open a new tab in the Custom Metadata settings"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnMdt">
						Custom Metadata
					</button>
				<li style="margin: 1px">
					<button title="Open a new tab in the Flow settings"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnFlw">
						Flows
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Open a new tab in the Apex Jobs (Batch) settings"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnApexJobs">
						Apex Jobs
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Open a new tab in the USERS settings"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnUsers">
						Setup Users
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Open a new tab in the Deploy"
						class="slds-button slds-button_brand"
						style="width: 150px"
						id="btnDeploy">
						Deploy Status
					</button>
				</li>
				<li style="margin: 1px">
					<button title="Delete all Apex Logs"
						class="slds-button slds-button_destructive"
						style="width: 150px"
						id="btnApexLog">
						Delete Apex Logs
					</button>
				</li>
				<hr style="margin-top: 0.8rem; margin-bottom: 0.8rem;" />
				<li style="margin: 1px">
					<button title="Settings"
						class="slds-button slds-button_outline-brand"
						style="width: 150px; height: 20px;"
						id="btnSettings">
						Settings
					</button>
				</li>
			</ul>
		</div>
		<div id="settings"
			class="slds-align_absolute-center"
			style="display: flex;width: -webkit-fill-available;text-align: center;height: 25rem;position:fixed;justify-content: center;flex-direction: column;flex-wrap: nowrap;align-content: center;align-items: center;">
			<label class="slds-form-element__label"
				style="font-weight: bold;font-size: small;top: 0%;position: absolute;"
				id="labelSettings"></label>
			<ul class="slds-has-block-links_space">
				<li style="margin-bottom: 5%;">
					<input type="checkbox"
						title="(WIP)"
						name="Always show ID"
						id="alwaysShowId">
					<label for="alwaysShowId">Always SHOW ID</label><br>
				</li>
				<hr style="margin: 5%;" />
				<li
					style="font-weight: bolder;font-family: monospace;border-width: thin;border-style: dashed;border-radius: 20px;padding: 3%;">
					<label class="slds-form-element__label"
						id="combobox-label-id-131">Api Versions</label>
					<br />
					<select name="ApiVersions"
						style="width: 90px;text-align: -webkit-match-parent;"
						id="apiVersionCombobox">
					</select>
					<br />
					<label class="slds-form-element__label">Current Api</label>
					<br />
					<label class="slds-form-element__label"
						id="currentApiSelected">00.0</label>
				</li>
				<hr style="margin: 5%;" />
				<li style="margin: 15px">
					<button title="Sync Metadata (WIP)"
						class="slds-button slds-button_outline-brand"
						style="width: 150px"
						id="btnSyncMetadata">
						Sync Metadata
					</button>
					<br />
					<label class="slds-form-element__label"
						id="lastMetadataSyncDate">never</label>
				</li>
				<hr style="margin-top: 0.8rem; margin-bottom: 0.8rem;" />
				<li style="margin: 1px">
					<button title="Settings"
						class="slds-button slds-button_outline-brand"
						style="width: 150px;"
						id="btnBackToMain">
						Back
					</button>
				</li>
				<li style="margin: 1px">
					<button title="FAQ/DOC"
						class="slds-button slds-button_outline-brand"
						style="left: 6%;width: 70px;position: absolute;bottom: 2%;"
						id="btnFaqDoc">
						FAQ/DOC
					</button>
					<a href="https://www.buymeacoffee.com/IziPeezeLemonSqueeze"
						target="_blank"><img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
							alt="Buy Me A Coffee"
							style="bottom: 1%;scale: 0.75;right: 0%;position: absolute;height: 40px !important;width: 140px !important;"></a>
				</li>
			</ul>
		</div>


	</body>
	<style>
		#tutorial {
			pointer-events: none;
			left: 0;
			top: 0;
			height: -webkit-fill-available;
			width: -webkit-fill-available;
			position: absolute;
			border: 2px solid #fff;
			border-radius: 8px;
			transition: opacity 1s ease-in-out;
			z-index: 1000000000000000000000;
		}

		#stepGreetings {
			transform: scale(1);
			padding: 5%;
			font-size: 43px;
			align-content: center;
			font-family: system-ui;
			font-style: oblique;
			font-weight: bolder;
			text-align: center;
			top: 9%;
			position: sticky;
			width: -webkit-fill-available;
			height: 91%;
			background: rgba(101, 255, 96, 0.46);
			border: 2px solid white;
			transition: opacity 1s ease-in-out;
			pointer-events: auto;
		}

		#stepTwoUpBlock {
			transform: scale(1);
			font-size: 30px;
			align-content: flex-start;
			font-family: system-ui;
			font-style: oblique;
			font-weight: bolder;
			text-align: center;
			top: 9%;
			position: sticky;
			width: -webkit-fill-available;
			height: 22%;
			background: rgb(96 189 255 / 46%);
			border: 2px solid white;
			transition: opacity 1s ease-in-out;
			pointer-events: auto;
		}

		#stepTwoBlock {
			transform: scale(1);
			padding: 5%;
			font-size: 43px;
			align-content: flex-end;
			font-family: system-ui;
			font-style: oblique;
			font-weight: bolder;
			text-align: center;
			top: 55%;
			position: sticky;
			width: -webkit-fill-available;
			height: 45%;
			background: rgb(96 189 255 / 46%);
			border: 2px solid white;
			transition: opacity 1s ease-in-out;
			pointer-events: auto;
		}


		#stepOneBlock {
			padding: 5%;
			font-size: 43px;
			align-content: flex-end;
			font-family: system-ui;
			font-style: oblique;
			font-weight: bolder;
			text-align: center;
			top: 9%;
			position: sticky;
			width: -webkit-fill-available;
			height: 80%;
			background: rgb(96 189 255 / 46%);
			border: 2px solid white;
			transition: opacity 1s ease-in-out;
			pointer-events: auto;
		}

		@keyframes pulse {
			0% {
				color: #fcfcfc;
				left: 0px;
				top: 0px;
			}

			25% {
				color: #60bdff;
				left: 200px;
				top: 0px;
			}

			50% {
				color: #fcfcfc;
				left: 200px;
				top: 200px;
			}

			75% {
				color: #60bdff;
				left: 0px;
				top: 200px;
			}

			100% {
				color: #fcfcfc;
				left: 0px;
				top: 0px;
			}
		}

		#freccia {
			background: transparent;
			align-items: anchor-center;
			font-size: larger;
			pointer-events: none;
			margin-top: 20%;
			animation-name: pulse;
			animation-duration: 4s;
			animation-iteration-count: infinite;
		}
	</style>

</html>
